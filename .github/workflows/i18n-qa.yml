name: i18n QA

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  i18n-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: i18n hardcoded-string audit
        run: bun run i18n:audit:strict
