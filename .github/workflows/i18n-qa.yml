name: i18n QA

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  i18n-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: i18n hardcoded-string audit
        run: npm run i18n:audit:strict
