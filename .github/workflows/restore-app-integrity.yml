name: Restore app integrity

on:
  push:
    branches: ['feat/full-i18n-ar-en-ur']

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[app-repaired]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App from main
        run: |
          git fetch origin main
          git checkout origin/main -- src/App.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet || git commit -m 'fix(i18n): restore App business logic [app-repaired]'
          git push
